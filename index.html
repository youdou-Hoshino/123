<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Text ✦ 粒子文字</title>
<style>
  :root {
    --bg: #0d0d14;
    --panel: rgba(22, 22, 34, 0.82);
    --accent: #7c6cff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #e8e8f0;
  }
  canvas { display: block; }

  .panel {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 12px 16px;
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.45);
    z-index: 10;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 92vw;
  }
  .panel input[type="text"] {
    width: 200px;
    padding: 8px 12px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    background: rgba(255,255,255,0.06);
    color: #fff;
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
  }
  .panel input[type="text"]:focus { border-color: var(--accent); }
  .panel input[type="color"] {
    width: 34px; height: 34px;
    border: none; border-radius: 8px;
    background: none; cursor: pointer;
    padding: 0;
  }
  .panel button {
    padding: 8px 14px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    background: rgba(255,255,255,0.07);
    color: #e8e8f0;
    font-size: 13px;
    cursor: pointer;
    transition: background .2s, transform .1s;
    white-space: nowrap;
  }
  .panel button:hover { background: rgba(255,255,255,0.16); }
  .panel button:active { transform: scale(0.96); }

  .hint {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12.5px;
    letter-spacing: 0.5px;
    color: rgba(232,232,240,0.45);
    pointer-events: none;
    z-index: 10;
    text-align: center;
  }
  .hint b { color: rgba(232,232,240,0.75); font-weight: 600; }

  @media (max-width: 560px) {
    .panel input[type="text"] { width: 130px; }
    .hint { font-size: 11px; width: 90vw; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hint">
  鼠标划过 <b>扰动粒子</b> · 单击画布 <b>爆炸</b> · 回车或按钮 <b>更新文字</b>
</div>

<div class="panel">
  <input type="text" id="textInput" maxlength="12" placeholder="输入文字…" value="HELLO">
  <input type="color" id="colorPick" value="#7c6cff" title="粒子颜色">
  <button id="applyBtn">✦ 生成</button>
  <button id="explodeBtn">💥 爆炸</button>
  <button id="rainbowBtn">🌈 彩虹</button>
</div>

<script>
(() => {
  "use strict";
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");

  let W, H, dpr;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();

  // ---------- particle model ----------
  let particles = [];
  let rainbow = false;
  let baseColor = [124, 108, 255]; // matches #7c6cff
  let hue = 0;

  function hexToRgb(hex) {
    const h = hex.replace("#", "");
    return [
      parseInt(h.slice(0, 2), 16),
      parseInt(h.slice(2, 4), 16),
      parseInt(h.slice(4, 6), 16)
    ];
  }

  // sample text pixels -> target points
  function samplePoints(text) {
    const off = document.createElement("canvas");
    const octx = off.getContext("2d");
    const fs = Math.min(260, (W * 0.85) / Math.max(text.length, 1) * 1.5, H * 0.38);
    octx.font = "900 " + fs + "px 'Segoe UI', 'Microsoft YaHei', sans-serif";
    const m = octx.measureText(text);
    const tw = Math.ceil(m.width);
    const th = Math.ceil(fs * 1.25);
    off.width = tw; off.height = th;
    octx.font = "900 " + fs + "px 'Segoe UI', 'Microsoft YaHei', sans-serif";
    octx.textBaseline = "middle";
    octx.fillStyle = "#fff";
    octx.fillText(text, 0, th / 2);

    const data = octx.getImageData(0, 0, tw, th).data;
    const gap = tw > 500 ? 3 : 2; // sampling density
    const pts = [];
    for (let y = 0; y < th; y += gap) {
      for (let x = 0; x < tw; x += gap) {
        if (data[(y * tw + x) * 4 + 3] > 128) {
          pts.push({
            x: (W - tw) / 2 + x,
            y: (H - th) / 2 + y
          });
        }
      }
    }
    return pts;
  }

  function build(text) {
    const pts = samplePoints(text || "HELLO");
    const old = particles;
    particles = pts.map((p, i) => {
      const prev = old[i];
      return {
        tx: p.x, ty: p.y,
        x: prev ? prev.x : Math.random() * W,
        y: prev ? prev.y : Math.random() * H,
        vx: 0, vy: 0,
        size: Math.random() * 1.6 + 0.9,
        seed: Math.random() * Math.PI * 2
      };
    });
    // if new text has fewer points, drop leftovers; if more, they were created fresh
  }

  function explode() {
    for (const p of particles) {
      const a = Math.random() * Math.PI * 2;
      const f = Math.random() * 14 + 4;
      p.vx += Math.cos(a) * f;
      p.vy += Math.sin(a) * f;
    }
  }

  // ---------- interaction ----------
  let mouse = { x: -9999, y: -9999, active: false };
  window.addEventListener("mousemove", e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; });
  window.addEventListener("mouseout", () => { mouse.active = false; });
  window.addEventListener("touchmove", e => {
    mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; mouse.active = true;
  }, { passive: true });
  canvas.addEventListener("click", explode);

  const input = document.getElementById("textInput");
  const colorPick = document.getElementById("colorPick");
  document.getElementById("applyBtn").addEventListener("click", () => {
    build(input.value.trim() || "HELLO");
  });
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") build(input.value.trim() || "HELLO");
  });
  colorPick.addEventListener("input", () => {
    baseColor = hexToRgb(colorPick.value);
  });
  document.getElementById("explodeBtn").addEventListener("click", explode);
  document.getElementById("rainbowBtn").addEventListener("click", function () {
    rainbow = !rainbow;
    this.textContent = rainbow ? "🌈 单色" : "🌈 彩虹";
  });

  window.addEventListener("resize", () => {
    resize();
    build(input.value.trim() || "HELLO");
  });

  // ---------- render loop ----------
  function tick() {
    ctx.fillStyle = "rgba(13, 13, 20, 0.28)";
    ctx.fillRect(0, 0, W, H);
    if (rainbow) hue = (hue + 0.6) % 360;

    for (const p of particles) {
      // spring toward target
      p.vx += (p.tx - p.x) * 0.012;
      p.vy += (p.ty - p.y) * 0.012;

      // mouse repulsion
      if (mouse.active) {
        const dx = p.x - mouse.x, dy = p.y - mouse.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < 8100) { // 90px radius
          const d = Math.sqrt(d2) || 1;
          const f = (90 - d) / 90 * 1.8;
          p.vx += (dx / d) * f;
          p.vy += (dy / d) * f;
        }
      }

      p.vx *= 0.9; p.vy *= 0.9;
      p.x += p.vx; p.y += p.vy;

      const col = rainbow
        ? "hsl(" + ((hue + p.seed * 30) % 360) + ", 85%, 62%)"
        : "rgb(" + baseColor[0] + "," + baseColor[1] + "," + baseColor[2] + ")";
      ctx.fillStyle = col;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    }
    requestAnimationFrame(tick);
  }

  build("HELLO");
  tick();
})();
</script>
</body>
</html>
